
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Type Master — Speed Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="timer-page">
<div class="db-root">
  <div class="bg-grid"></div>
  <div class="glow-orb one"></div>
  <div class="glow-orb two"></div>

  <header class="topbar">
    <div class="logo">
      <div class="logo-icon">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="4" width="14" height="9" rx="2" stroke="#0a0c10" stroke-width="1.5"/>
          <path d="M4 8h1M7 8h1M10 8h1M4 10.5h8" stroke="#0a0c10" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
      TYPE_MASTER
    </div>
    <nav class="nav-pills">
      <a href="index.html" class="nav-pill">Dashboard</a>
      <a href="practice.html" class="nav-pill">Practice</a>
      <span class="nav-pill active">Speed Test</span>
    </nav>
    <div class="topbar-spacer"></div>
  </header>

  <main class="main-content">
    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-val" id="time">60</div>
        <div class="stat-label">Seconds Left</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="wpm">0</div>
        <div class="stat-label">WPM</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="accuracy">100<span class="stat-unit">%</span></div>
        <div class="stat-label">Accuracy</div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-label-row">
        <span>Progress</span>
        <span id="progress-label">60s</span>
      </div>
      <div class="progress-track">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </div>

    <div class="text-card" onclick="document.getElementById('hidden-input').focus()">
      <div class="section-badge">
        <span class="badge-dot"></span>
        Speed Test
      </div>
      <div id="text-display"></div>
      <input type="text" id="hidden-input" autofocus autocomplete="off" spellcheck="false" />
    </div>

    <button id="restart" class="btn-restart">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M1 7a6 6 0 1 0 1.2-3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M1 3.4V7h3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Restart
    </button>
  </main>

  <div class="kb-hint">
    press <kbd>Esc</kbd> to go back · <kbd>Tab</kbd> to restart
  </div>
</div>

<!-- Results Overlay — timer page specific -->
<div id="results-overlay">
  <div class="timer-results-card">

    <div class="timer-results-header">
      <span class="timer-results-eyebrow">— Test Complete —</span>
    </div>

    <!-- Net Speed = hero stat -->
    <div class="timer-net-speed-wrap">
      <div class="timer-net-label">Net Speed</div>
      <div class="timer-net-value" id="res-net">0</div>
      <div class="timer-net-unit">wpm × accuracy</div>
    </div>

    <!-- Breakdown row -->
    <div class="timer-breakdown">
      <div class="timer-breakdown-item">
        <div class="timer-breakdown-val" id="res-wpm">0</div>
        <div class="timer-breakdown-label">Raw WPM</div>
      </div>
      <div class="timer-breakdown-divider">×</div>
      <div class="timer-breakdown-item">
        <div class="timer-breakdown-val" id="res-accuracy">0%</div>
        <div class="timer-breakdown-label">Accuracy</div>
      </div>
      <div class="timer-breakdown-divider">=</div>
      <div class="timer-breakdown-item">
        <div class="timer-breakdown-val accent" id="res-net2">0</div>
        <div class="timer-breakdown-label">Net WPM</div>
      </div>
    </div>

    <!-- Chars typed -->
    <div class="timer-chars-row">
      <span class="timer-chars-label">Characters typed</span>
      <span class="timer-chars-val" id="res-chars">0</span>
    </div>

    <!-- Actions -->
    <div class="timer-results-actions">
      <button class="timer-btn-primary" id="res-restart">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M1 7a6 6 0 1 0 1.2-3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M1 3.4V7h3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Try Again
      </button>
      <a href="index.html" class="timer-btn-ghost">Back to Dashboard</a>
    </div>
  </div>
</div>

<script src="texts.js"></script>
<script src="script.js"></script>
<script>
  /* ── Progress bar — watches #time via MutationObserver ── */
  const TOTAL = 60;
  const progressBar   = document.getElementById('progress-bar');
  const progressLabel = document.getElementById('progress-label');
  const timeEl        = document.getElementById('time');

  const observer = new MutationObserver(() => {
    const remaining = parseInt(timeEl.textContent) || 0;
    progressBar.style.width = (remaining / TOTAL * 100) + '%';
    progressLabel.textContent = remaining + 's';
    timeEl.classList.remove('urgent', 'warn');
    if (remaining <= 10)      timeEl.classList.add('urgent');
    else if (remaining <= 20) timeEl.classList.add('warn');
  });
  observer.observe(timeEl, { childList: true, characterData: true, subtree: true });

  /* ── Keyboard shortcuts ── */
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      // if results open, close it; else go back
      const overlay = document.getElementById('results-overlay');
      if (overlay.classList.contains('show')) {
        overlay.classList.remove('show');
      } else {
        window.location.href = 'index.html';
      }
    }
    if (e.key === 'Tab') {
      e.preventDefault();
      document.getElementById('restart').click();
    }
  });

  /* ── Results overlay ── */
  // script.js calls window.showResults(wpm, accuracy, chars)
  window.showResults = function(wpm, accuracy, chars) {
    const net = Math.round(wpm * (accuracy / 100));
    document.getElementById('res-wpm').textContent      = wpm;
    document.getElementById('res-accuracy').textContent = accuracy + '%';
    document.getElementById('res-chars').textContent    = chars;
    document.getElementById('res-net').textContent      = net;
    document.getElementById('res-net2').textContent     = net;
    document.getElementById('results-overlay').classList.add('show');
  };

  document.getElementById('res-restart').addEventListener('click', () => {
    document.getElementById('results-overlay').classList.remove('show');
    document.getElementById('restart').click();
  });
</script>
</body>
</html>
