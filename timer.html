
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Type Master — Speed Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="db-root">
  <div class="bg-grid"></div>
  <div class="glow-orb one"></div>
  <div class="glow-orb two"></div>

  <!-- Top Bar -->
  <header class="topbar">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="4" width="14" height="9" rx="2" stroke="#0a0c10" stroke-width="1.5"/>
          <path d="M4 8h1M7 8h1M10 8h1M4 10.5h8" stroke="#0a0c10" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
      TYPE_MASTER
    </div>
    <nav class="nav-pills">
      <a href="index.html" class="nav-pill">Dashboard</a>
      <a href="practice.html" class="nav-pill">Practice</a>
      <span class="nav-pill active">Speed Test</span>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="main-content">

    <!-- Stats Row -->
    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-val" id="time">60</div>
        <div class="stat-label">Seconds Left</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="wpm">0</div>
        <div class="stat-label">WPM</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="accuracy">100<span class="stat-unit">%</span></div>
        <div class="stat-label">Accuracy</div>
      </div>
    </div>

    <!-- Progress bar -->
    <div class="progress-wrap">
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
    </div>

    <!-- Text Display -->
    <div class="text-card">
      <div class="section-badge">
        <span class="badge-dot"></span>
        Speed Test
      </div>
      <div id="text-display"></div>
      <input type="text" id="hidden-input" autofocus autocomplete="off" />
    </div>

    <!-- Restart button -->
    <button id="restart" class="btn-restart">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M1 7a6 6 0 1 0 1.2-3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M1 3.4V7h3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Restart
    </button>

  </main>

  <div class="kb-hint">
    press <kbd>Esc</kbd> to go back · <kbd>Tab</kbd> to restart
  </div>
</div>

<script src="texts.js"></script>
<script src="script.js"></script>
<script>
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.location.href = 'index.html';
    if (e.key === 'Tab') {
      e.preventDefault();
      document.getElementById('restart').click();
    }
  });
</script>
</body>
</html>
