
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Type Master — Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="practice-page">
<div class="db-root">

  <div class="bg-grid"></div>
  <div class="glow-orb one"></div>
  <div class="glow-orb two"></div>

  <!-- Top Bar -->
  <header class="topbar">
    <div class="logo">
      <div class="logo-icon">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="4" width="14" height="9" rx="2" stroke="#0a0c10" stroke-width="1.5"/>
          <path d="M4 8h1M7 8h1M10 8h1M4 10.5h8" stroke="#0a0c10" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
      TYPESPRINT
    </div>

    <nav class="nav-pills">
      <a href="index.html" class="nav-pill">Dashboard</a>
      <span class="nav-pill active">Practice</span>
      <a href="timer.html" class="nav-pill">Speed Test</a>
    </nav>

    <div class="topbar-spacer"></div>
  </header>

  <!-- Main Stage -->
  <main class="stage">

    <!-- Big Letter -->
    <div class="letter-area">
      <div class="letter-hint">Current letter</div>
      <div class="letter-display" id="current-letter">A</div>
    </div>

    <!-- Word Box -->
    <div class="typing-area">
      <div id="text-display"></div>
      <div class="key-hint">
        <kbd>Space</kbd> next word &nbsp;·&nbsp; <kbd>Esc</kbd> quit
      </div>
    </div>

    <!-- Progress -->
    <div class="progress-area">
      <div class="progress-header">
        <span class="progress-label">Progress</span>
        <span class="progress-label" id="progress-label">0 / 26 letters</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- Keyboard -->
    <div class="kb-area">
      <div id="keyboard">
        <div class="row">
          <span class="key">q</span><span class="key">w</span><span class="key">e</span>
          <span class="key">r</span><span class="key">t</span><span class="key">y</span>
          <span class="key">u</span><span class="key">i</span><span class="key">o</span>
          <span class="key">p</span>
        </div>
        <div class="row">
          <span class="key">a</span><span class="key">s</span><span class="key">d</span>
          <span class="key">f</span><span class="key">g</span><span class="key">h</span>
          <span class="key">j</span><span class="key">k</span><span class="key">l</span>
        </div>
        <div class="row">
          <span class="key">z</span><span class="key">x</span><span class="key">c</span>
          <span class="key">v</span><span class="key">b</span><span class="key">n</span>
          <span class="key">m</span>
        </div>
      </div>
    </div>

  </main>

  <!-- Footer dots -->
  <footer class="footer-bar">
    <div class="letter-dots" id="letter-dots"></div>
  </footer>

  <!-- Hidden input -->
  <input type="text" id="hidden-input" autofocus autocomplete="off" />

  <!-- Completion Popup -->
  <div id="completion-popup" class="popup hidden">
    <div class="popup-card">
      <div class="popup-icon">🎯</div>
      <h2 class="popup-title">Practice Complete!</h2>
      <p class="popup-sub">You've mastered all 26 letters. Great work!</p>
      <div class="popup-actions">
        <button id="restart-btn" class="btn-primary">Restart Practice</button>
        <a href="index.html" class="btn-secondary">Back to Dashboard</a>
      </div>
    </div>
  </div>

</div>

<script src="practice.js"></script>
<script>
  /* Build 26 alphabet dots in footer */
  const dotsEl = document.getElementById('letter-dots');
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l => {
    const d = document.createElement('div');
    d.className = 'l-dot';
    d.title = l;
    d.dataset.letter = l;
    dotsEl.appendChild(d);
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') window.location.href = 'index.html';
  });
</script>
</body>
</html>
